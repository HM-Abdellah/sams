name: SAMS PHP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php:
    runs-on: ubuntu-latest
    container:
      image: php:8.4-cli

    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sams
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SAMS_TEST_DB_HOST: db
      SAMS_TEST_DB_PORT: 3306
      SAMS_TEST_DB_NAME: sams
      SAMS_TEST_DB_USER: root
      SAMS_TEST_DB_PASS: root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install MySQL PDO extension
        shell: sh
        run: docker-php-ext-install pdo_mysql

      - name: Lint PHP sources
        shell: sh
        run: |
          find api app config public scripts tests -type f -name '*.php' -print0             | xargs -0 -n1 php -l

      - name: Run service tests
        shell: sh
        run: php tests/run.php

      - name: Run MariaDB integration tests
        shell: sh
        run: php tests/integration.php

  javascript:
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        shell: sh
        run: |
          find public/assets/js tests/e2e -type f -name '*.js' -print0             | xargs -0 -n1 node --check

  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble

    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sams
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SAMS_TEST_DB_HOST: db
      SAMS_TEST_DB_PORT: 3306
      SAMS_TEST_DB_NAME: sams
      SAMS_TEST_DB_USER: root
      SAMS_TEST_DB_PASS: root
      SAMS_E2E_PASSWORD: e2e-admin-password-2026
      SAMS_E2E_TEACHER_PASSWORD: e2e-teacher-password-2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install PHP and MySQL extension
        run: |
          apt-get update
          apt-get install -y php-cli php-mysql curl

      - name: Configure E2E database
        shell: bash
        run: |
          cat > config/database.php <<'PHP'
          <?php
          return [
              'host' => getenv('SAMS_TEST_DB_HOST') ?: 'db',
              'port' => (int)(getenv('SAMS_TEST_DB_PORT') ?: 3306),
              'database' => getenv('SAMS_TEST_DB_NAME') ?: 'sams',
              'username' => getenv('SAMS_TEST_DB_USER') ?: 'root',
              'password' => getenv('SAMS_TEST_DB_PASS') ?: 'root',
              'charset' => 'utf8mb4',
          ];
          PHP

      - name: Seed clean E2E school
        run: php scripts/e2e_seed.php

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Start PHP server
        shell: bash
        run: |
          php -S 0.0.0.0:8080 -t public > /tmp/sams-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/login.php > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sams-server.log
          exit 1

      - name: Run Playwright E2E
        env:
          SAMS_BASE_URL: http://127.0.0.1:8080
          SAMS_E2E_USERNAME: admin
          SAMS_E2E_TEACHER_USERNAME: teacher.e2e
        run: npm run test:e2e
