name: SAMS PHP CI

concurrency:
  group: sams-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  statuses: write
  contents: read
  issues: write

on:
  push:
    branches: [main, feat/phase-11-final-review, refactor/phase-2-backend-foundation, feat/phase-3-school-import-v2, feat/phase-4-teacher-attendance-backend, feat/phase-5-administration-backend, feat/phase-6-archive-reports-signatures, feat/phase-7-security-reliability, feat/phase-8-ci-base-v2, feat/phase-8-final-gate-v4, feat/phase-9-clean-school-acceptance]
  pull_request:
    branches: [main, refactor/phase-2-backend-foundation, feat/phase-5-administration-backend, feat/phase-6-archive-reports-signatures, feat/phase-8-ci-base-v2]

jobs:
  php:
    runs-on: ubuntu-latest
    container:
      image: php:8.3-cli

    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sams
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SAMS_TEST_DB_HOST: db
      SAMS_TEST_DB_PORT: 3306
      SAMS_TEST_DB_NAME: sams
      SAMS_TEST_DB_USER: root
      SAMS_TEST_DB_PASS: root
      SAMS_ALLOW_EXAMPLE_CONFIG: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install PHP extensions and Composer
        shell: sh
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git libxml2-dev libonig-dev libzip-dev libfreetype6-dev libjpeg62-turbo-dev libpng-dev libwebp-dev curl unzip mariadb-client
          docker-php-ext-configure gd --with-freetype --with-jpeg --with-webp
          docker-php-ext-install dom gd mbstring pdo_mysql xml xmlwriter zip

          EXPECTED_CHECKSUM="$(curl -fsSL https://composer.github.io/installer.sig)"
          curl -fsSL https://getcomposer.org/installer -o composer-setup.php
          echo "${EXPECTED_CHECKSUM}  composer-setup.php" | sha384sum -c -
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          rm composer-setup.php

      - name: Verify PHP runtime
        shell: sh
        run: php -v

      - name: Install backend dependencies
        working-directory: backend
        shell: sh
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify locked dependency graph
        working-directory: backend
        shell: sh
        run: |
          composer validate --no-check-publish
          composer check-platform-reqs --no-dev
          composer audit --locked --no-dev

      - name: Verify application configuration fails closed
        shell: sh
        run: |
          if SAMS_ALLOW_EXAMPLE_CONFIG=0 php -r 'require "backend/src/bootstrap.php";'; then
            echo "Application bootstrap unexpectedly accepted missing application configuration."
            exit 1
          fi
          SAMS_ALLOW_EXAMPLE_CONFIG=1 php -r 'require "backend/src/bootstrap.php";'
          echo "[PASS] Application bootstrap requires explicit configuration outside test/development fallback."

      - name: Configure backend database
        shell: sh
        run: |
          cat > backend/config/database.php <<'PHP'
          <?php
          return [
              'host' => getenv('SAMS_TEST_DB_HOST') ?: 'db',
              'port' => (int)(getenv('SAMS_TEST_DB_PORT') ?: 3306),
              'database' => getenv('SAMS_TEST_DB_NAME') ?: 'sams',
              'username' => getenv('SAMS_TEST_DB_USER') ?: 'root',
              'password' => getenv('SAMS_TEST_DB_PASS') ?: 'root',
              'charset' => 'utf8mb4',
          ];
          PHP

      - name: Lint PHP sources
        shell: sh
        run: |
          find api app backend config public scripts tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run legacy service tests
        shell: sh
        run: php tests/run.php

      - name: Run backend unit tests
        working-directory: backend
        shell: sh
        run: vendor/bin/phpunit --configuration phpunit.xml

      - name: Checkout release baseline schema for migration verification
        uses: actions/checkout@v6
        with:
          ref: 4daaeb492923a7cdfb909b13c72ae39fb63d0e48
          path: release-baseline

      - name: Verify migration 005 upgrade path
        shell: sh
        run: |
          SAMS_MIGRATION_BASE_SCHEMA=release-baseline/database/schema.sql php tests/migration_005_integration.php

      - name: Verify migration 006 upgrade path
        shell: sh
        run: |
          SAMS_MIGRATION_BASE_SCHEMA=release-baseline/database/schema.sql php tests/migration_006_integration.php

      - name: Verify tenant isolation boundaries
        shell: sh
        run: |
          php tests/tenant_isolation_integration.php

      - name: Run MariaDB integration tests
        shell: sh
        run: php tests/integration.php

      - name: Run whole-school import integration tests
        shell: sh
        run: php tests/school_import_final_integration.php

      - name: Run XLSX resource-limit integration tests
        shell: sh
        run: php tests/xlsx_resource_limits_integration.php

      - name: Run teacher attendance integration tests
        shell: sh
        run: php tests/attendance_backend_integration.php

      - name: Run concurrency regression suite
        shell: sh
        run: php tests/concurrency_regression.php

      - name: Run administration integration tests
        shell: sh
        run: php tests/administration_backend_integration.php

      - name: Run archive, reports, and signatures integration tests
        shell: sh
        run: php tests/phase6_archive_reports_signatures_integration.php

      - name: Run security and reliability integration tests
        shell: sh
        run: php tests/phase7_security_reliability_integration.php

      - name: Run backup and restore integration test
        shell: sh
        run: php tests/backup_restore_integration.php

      - name: Audit tracked secrets and local config paths
        shell: sh
        run: |
          tree_json=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/trees/$GITHUB_SHA?recursive=1")
          printf '%s' "$tree_json" | php -r '
          $tree = json_decode(stream_get_contents(STDIN), true, 512, JSON_THROW_ON_ERROR);
          $forbidden = [
              ".env",
              "config/app.php",
              "config/database.php",
              "backend/config/app.php",
              "backend/config/database.php",
          ];
          foreach ((array)($tree["tree"] ?? []) as $entry) {
              $path = (string)($entry["path"] ?? "");
              if (in_array($path, $forbidden, true) || (str_starts_with($path, ".env.") && $path !== ".env.example")) {
                  fwrite(STDERR, "forbidden tracked path: {$path}\n");
                  exit(1);
              }
          }'

      - name: Run API HTTP smoke tests
        shell: sh
        run: |
          php tests/api_http_smoke_seed.php
          mkdir -p /tmp/sams-api-sessions
          php -d session.save_path=/tmp/sams-api-sessions -d session.name=SAMS_SESSION -S 127.0.0.1:8090 scripts/dev_router.php > /tmp/sams-api.log 2>&1 &
          server_pid=$!

          cleanup() {
            status=$?
            trap - EXIT
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          for i in $(seq 1 20); do
            if curl -sS http://127.0.0.1:8090/api/v1/health > /tmp/sams-health.json 2>/dev/null; then
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "API server exited before becoming ready."
              cat /tmp/sams-api.log
              exit 1
            fi

            sleep 1
          done

          health_status=$(curl -sS -o /tmp/sams-health.json -w "%{http_code}" http://127.0.0.1:8090/api/v1/health)
          test "$health_status" = "200"
          grep -q '"success":true' /tmp/sams-health.json
          grep -q '"api_version":"v1"' /tmp/sams-health.json
          curl -sS -D /tmp/sams-health-headers.txt -o /dev/null http://127.0.0.1:8090/api/v1/health
          grep -qi '^X-Content-Type-Options: nosniff' /tmp/sams-health-headers.txt
          grep -qi '^Referrer-Policy: same-origin' /tmp/sams-health-headers.txt
          grep -qi '^X-Frame-Options: DENY' /tmp/sams-health-headers.txt
          grep -qi '^Content-Security-Policy: default-src '"'"'none'"'"'; frame-ancestors '"'"'none'"'"'; base-uri '"'"'none'"'"'' /tmp/sams-health-headers.txt
          grep -qi '^Permissions-Policy: camera=(), geolocation=(), microphone=()' /tmp/sams-health-headers.txt
          ! grep -qi '^Strict-Transport-Security:' /tmp/sams-health-headers.txt

          method_status=$(curl -sS -o /tmp/sams-method.json -w "%{http_code}" -X POST http://127.0.0.1:8090/api/v1/health)
          test "$method_status" = "405"
          grep -q '"success":false' /tmp/sams-method.json

          missing_status=$(curl -sS -o /tmp/sams-missing.json -w "%{http_code}" http://127.0.0.1:8090/api/v1/does-not-exist)
          test "$missing_status" = "404"

          import_auth_status=$(curl -sS -o /tmp/sams-import-auth.json -w "%{http_code}" -X POST http://127.0.0.1:8090/api/v1/imports/school/1/reconcile)
          test "$import_auth_status" = "401"
          grep -q '"success":false' /tmp/sams-import-auth.json

          attendance_get_auth_status=$(curl -sS -o /tmp/sams-attendance-get-auth.json -w "%{http_code}" http://127.0.0.1:8090/api/v1/classes/1/attendance?week_start=2026-09-23)
          test "$attendance_get_auth_status" = "401"
          grep -q '"success":false' /tmp/sams-attendance-get-auth.json

          attendance_bulk_auth_status=$(curl -sS -o /tmp/sams-attendance-bulk-auth.json -w "%{http_code}" -X POST http://127.0.0.1:8090/api/v1/classes/1/attendance/bulk -H 'Content-Type: application/json' --data '{"entries":[]}' )
          test "$attendance_bulk_auth_status" = "401"
          grep -q '"success":false' /tmp/sams-attendance-bulk-auth.json

          admin_get_status=$(curl -sS -o /tmp/sams-admin-auth.json -w "%{http_code}" http://127.0.0.1:8090/api/v1/admin/dashboard)
          test "$admin_get_status" = "401"
          grep -q '"success":false' /tmp/sams-admin-auth.json

          admin_sid=$(php -d session.save_path=/tmp/sams-api-sessions -r 'session_name("SAMS_SESSION"); session_start(); $_SESSION["_auth_user"]=["id"=>1,"session_version"=>1]; $_SESSION["_csrf_token"]="phase5-ci-token"; session_write_close(); echo session_id();')

          dashboard_status=$(curl -sS -o /tmp/sams-admin-dashboard.json -w "%{http_code}" -b "SAMS_SESSION=$admin_sid" http://127.0.0.1:8090/api/v1/admin/dashboard)
          test "$dashboard_status" = "200"
          grep -q '"summary"' /tmp/sams-admin-dashboard.json

          classes_status=$(curl -sS -o /tmp/sams-admin-classes.json -w "%{http_code}" -b "SAMS_SESSION=$admin_sid" http://127.0.0.1:8090/api/v1/admin/classes)
          test "$classes_status" = "200"
          grep -q '"classes"' /tmp/sams-admin-classes.json

          users_status=$(curl -sS -o /tmp/sams-admin-users.json -w "%{http_code}" -b "SAMS_SESSION=$admin_sid" http://127.0.0.1:8090/api/v1/admin/users)
          test "$users_status" = "200"
          ! grep -q 'password_hash' /tmp/sams-admin-users.json

          teacher_status=$(curl -sS -o /tmp/sams-admin-teachers.json -w "%{http_code}" -b "SAMS_SESSION=$admin_sid" http://127.0.0.1:8090/api/v1/admin/teachers)
          test "$teacher_status" = "200"
          ! grep -q 'password_hash' /tmp/sams-admin-teachers.json

          years_status=$(curl -sS -o /tmp/sams-admin-years.json -w "%{http_code}" -b "SAMS_SESSION=$admin_sid" http://127.0.0.1:8090/api/v1/admin/academic-years)
          test "$years_status" = "200"
          grep -q '"academic_years"' /tmp/sams-admin-years.json

          audit_status=$(curl -sS -o /tmp/sams-admin-audit.json -w "%{http_code}" -b "SAMS_SESSION=$admin_sid" http://127.0.0.1:8090/api/v1/admin/audit)
          test "$audit_status" = "200"
          grep -q '"items"' /tmp/sams-admin-audit.json

          teacher_sid=$(php -d session.save_path=/tmp/sams-api-sessions -r 'session_name("SAMS_SESSION"); session_start(); $_SESSION["_auth_user"]=["id"=>2,"session_version"=>1]; $_SESSION["_csrf_token"]="phase5-ci-token"; session_write_close(); echo session_id();')
          counselor_sid=$(php -d session.save_path=/tmp/sams-api-sessions -r 'session_name("SAMS_SESSION"); session_start(); $_SESSION["_auth_user"]=["id"=>4,"session_version"=>1]; session_write_close(); echo session_id();')
          signature_b64='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGP4z8AAAAMBAQDJ/pLvAAAAAElFTkSuQmCC'

          archive_auth_status=$(curl -sS -o /tmp/sams-archive-auth.json -w "%{http_code}" "http://127.0.0.1:8090/api/v1/admin/archive?view=days&class_id=1&month=2026-09")
          test "$archive_auth_status" = "401"
          grep -q '"success":false' /tmp/sams-archive-auth.json

          archive_days_status=$(curl -sS -o /tmp/sams-archive-days.json -w "%{http_code}" -b "SAMS_SESSION=$admin_sid" "http://127.0.0.1:8090/api/v1/admin/archive?view=days&class_id=1&month=2026-09")
          test "$archive_days_status" = "200"
          grep -q '"days"' /tmp/sams-archive-days.json

          archive_month_status=$(curl -sS -o /tmp/sams-archive-month.json -w "%{http_code}" -b "SAMS_SESSION=$admin_sid" "http://127.0.0.1:8090/api/v1/admin/archive?view=month&class_id=1&month=2026-09")
          test "$archive_month_status" = "200"
          grep -q '"students"' /tmp/sams-archive-month.json
          ! grep -q 'password_hash' /tmp/sams-archive-month.json

          counselor_archive_status=$(curl -sS -o /tmp/sams-counselor-archive.json -w "%{http_code}" -b "SAMS_SESSION=$counselor_sid" "http://127.0.0.1:8090/api/v1/admin/archive?view=days&class_id=1&month=2026-09")
          test "$counselor_archive_status" = "403"

          report_auth_status=$(curl -sS -o /tmp/sams-report-auth.json -w "%{http_code}" "http://127.0.0.1:8090/api/v1/classes/1/report?month=2026-09")
          test "$report_auth_status" = "401"

          report_status=$(curl -sS -o /tmp/sams-report.json -w "%{http_code}" -b "SAMS_SESSION=$teacher_sid" "http://127.0.0.1:8090/api/v1/classes/1/report?month=2026-09")
          test "$report_status" = "200"
          grep -q '"students"' /tmp/sams-report.json
          ! grep -q 'password_hash' /tmp/sams-report.json

          signature_auth_status=$(curl -sS -o /tmp/sams-signature-auth.json -w "%{http_code}" "http://127.0.0.1:8090/api/v1/classes/1/signature")
          test "$signature_auth_status" = "401"

          signature_get_status=$(curl -sS -o /tmp/sams-signature-get.json -w "%{http_code}" -b "SAMS_SESSION=$teacher_sid" "http://127.0.0.1:8090/api/v1/classes/1/signature")
          test "$signature_get_status" = "200"

          signature_no_csrf_status=$(curl -sS -o /tmp/sams-signature-no-csrf.json -w "%{http_code}" -X POST -b "SAMS_SESSION=$teacher_sid" -H 'Content-Type: application/json' --data "{\"signature_data\":\"data:image/png;base64,${signature_b64}\"}" http://127.0.0.1:8090/api/v1/classes/1/signature)
          test "$signature_no_csrf_status" = "419"

          signature_save_status=$(curl -sS -o /tmp/sams-signature-save.json -w "%{http_code}" -X POST -b "SAMS_SESSION=$teacher_sid" -H 'X-CSRF-Token: phase5-ci-token' -H 'Content-Type: application/json' --data "{\"signature_data\":\"data:image/png;base64,${signature_b64}\"}" http://127.0.0.1:8090/api/v1/classes/1/signature)
          test "$signature_save_status" = "200"
          grep -q '"signature"' /tmp/sams-signature-save.json

          signature_delete_status=$(curl -sS -o /tmp/sams-signature-delete.json -w "%{http_code}" -X DELETE -b "SAMS_SESSION=$teacher_sid" -H 'X-CSRF-Token: phase5-ci-token' http://127.0.0.1:8090/api/v1/classes/1/signature)
          test "$signature_delete_status" = "200"
          grep -q '"changed":true' /tmp/sams-signature-delete.json

          php -r 'echo json_encode(["entries" => [], "padding" => str_repeat("x", 1000000)]);' > /tmp/sams-oversized-json-request.json
          oversized_json_status=$(curl -sS -o /tmp/sams-oversized-json.json -w "%{http_code}" -X POST -b "SAMS_SESSION=$teacher_sid" -H 'X-CSRF-Token: phase5-ci-token' -H 'Content-Type: application/json' --data-binary @/tmp/sams-oversized-json-request.json http://127.0.0.1:8090/api/v1/classes/1/attendance/bulk)
          test "$oversized_json_status" = "413"
          grep -q 'too large' /tmp/sams-oversized-json.json

          oversized_admin_status=$(curl -sS -o /tmp/sams-oversized-admin.json -w "%{http_code}" -X POST -b "SAMS_SESSION=$admin_sid" -H 'X-CSRF-Token: phase5-ci-token' -H 'Content-Type: application/json' --data-binary @/tmp/sams-oversized-json-request.json http://127.0.0.1:8090/api/v1/admin/classes)
          test "$oversized_admin_status" = "413"
          grep -q 'too large' /tmp/sams-oversized-admin.json

          oversized_signature_status=$(curl -sS -o /tmp/sams-oversized-signature.json -w "%{http_code}" -X POST -b "SAMS_SESSION=$teacher_sid" -H 'X-CSRF-Token: phase5-ci-token' -H 'Content-Type: application/json' --data-binary @/tmp/sams-oversized-json-request.json http://127.0.0.1:8090/api/v1/classes/1/signature)
          test "$oversized_signature_status" = "413"
          grep -q 'too large' /tmp/sams-oversized-signature.json

          no_csrf_class_status=$(curl -sS -o /tmp/sams-admin-no-csrf.json -w "%{http_code}" -X POST -b "SAMS_SESSION=$admin_sid" -H 'Content-Type: application/json' --data '{"action":"create","name":"HTTP CSRF MUST FAIL"}' http://127.0.0.1:8090/api/v1/admin/classes)
          test "$no_csrf_class_status" = "419"

          create_class_status=$(curl -sS -o /tmp/sams-admin-create-class.json -w "%{http_code}" -X POST -b "SAMS_SESSION=$admin_sid" -H 'X-CSRF-Token: phase5-ci-token' -H 'Content-Type: application/json' --data '{"action":"create","name":"HTTP Admin Class","level":"2BAC","branch":"SP"}' http://127.0.0.1:8090/api/v1/admin/classes)
          test "$create_class_status" = "201"
          grep -q '"id"' /tmp/sams-admin-create-class.json

          counselor_year_status=$(curl -sS -o /tmp/sams-counselor-years.json -w "%{http_code}" -b "SAMS_SESSION=$counselor_sid" http://127.0.0.1:8090/api/v1/admin/academic-years)
          test "$counselor_year_status" = "200"

          counselor_class_status=$(curl -sS -o /tmp/sams-counselor-classes.json -w "%{http_code}" -b "SAMS_SESSION=$counselor_sid" http://127.0.0.1:8090/api/v1/admin/classes)
          test "$counselor_class_status" = "403"

          echo "[PASS] API HTTP smoke: health=200 method=405 missing=404 import-auth=401 attendance-get-auth=401 attendance-bulk-auth=401 admin-auth=401 admin-read=200 admin-write-csrf=419 admin-create=201 counselor-rbac=200/403"

  javascript:
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        shell: sh
        run: |
          find public/assets/js tests/e2e -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  apache:
    runs-on: ubuntu-latest
    container:
      image: php:8.3-apache-bookworm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Apache runtime dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl unzip libzip-dev libxml2-dev libonig-dev libfreetype6-dev libjpeg62-turbo-dev libpng-dev libwebp-dev
          docker-php-ext-configure gd --with-freetype --with-jpeg --with-webp
          docker-php-ext-install dom gd mbstring pdo_mysql xml xmlwriter zip

          EXPECTED_CHECKSUM="$(curl -fsSL https://composer.github.io/installer.sig)"
          curl -fsSL https://getcomposer.org/installer -o composer-setup.php
          echo "${EXPECTED_CHECKSUM}  composer-setup.php" | sha384sum -c -
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          rm composer-setup.php

      - name: Install backend dependencies
        working-directory: backend
        shell: bash
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure local application runtime
        shell: bash
        run: |
          cat > backend/config/app.php <<'PHP'
          <?php
          return [
              'name' => 'SAMS',
              'environment' => 'test',
              'debug' => true,
              'base_path' => '/sams/public',
              'session_name' => 'SAMS_APACHE_SESSION',
              'session_lifetime' => 3600,
              'session_idle_timeout' => 3600,
              'session_absolute_timeout' => 43200,
              'login_max_attempts' => 5,
              'login_lock_minutes' => 15,
          ];
          PHP

          cat > backend/config/database.php <<'PHP'
          <?php
          return [
              'host' => '127.0.0.1',
              'port' => 3306,
              'database' => 'sams',
              'username' => 'root',
              'password' => 'root',
              'charset' => 'utf8mb4',
          ];
          PHP

      - name: Mount repository at Apache site root
        shell: bash
        run: |
          rm -rf /var/www/html/sams
          mkdir -p /var/www/html/sams
          cp -a "$GITHUB_WORKSPACE/." /var/www/html/sams/

      - name: Configure Apache overrides
        shell: bash
        run: |
          a2enmod rewrite headers
          cat > /etc/apache2/conf-enabled/sams.conf <<'APACHE'
          <Directory /var/www/html>
              AllowOverride All
              Require all granted
          </Directory>
          APACHE
          printf '%s\n' 'ServerName localhost' > /etc/apache2/conf-enabled/server-name.conf
          apachectl -t

      - name: Start Apache and run production-path smoke tests
        shell: bash
        run: |
          apache2-foreground > /tmp/sams-apache.log 2>&1 &
          apache_pid=$!

          cleanup() {
            kill "$apache_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1/sams/public/login.php > /dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$apache_pid" 2>/dev/null; then
              cat /tmp/sams-apache.log
              exit 1
            fi
            sleep 1
          done

          root_headers=/tmp/sams-apache-root.headers
          curl -sS -D "$root_headers" -o /dev/null http://127.0.0.1/sams/
          grep -qi '^HTTP/.* 302' "$root_headers"
          grep -qi '^Location: http://127.0.0.1/sams/public/' "$root_headers"

          login_status=$(curl -sS -o /tmp/sams-apache-login.html -w "%{http_code}" http://127.0.0.1/sams/public/login.php)
          test "$login_status" = "200"

          health_headers=/tmp/sams-apache-health.headers
          health_status=$(curl -sS -D "$health_headers" -o /tmp/sams-apache-health.json -w "%{http_code}" http://127.0.0.1/sams/api/v1/health)
          test "$health_status" = "200"
          grep -q '"success":true' /tmp/sams-apache-health.json
          grep -q '"api_version":"v1"' /tmp/sams-apache-health.json
          grep -qi '^X-Content-Type-Options: nosniff' "$health_headers"
          grep -qi '^X-Frame-Options: DENY' "$health_headers"
          grep -qi '^Referrer-Policy: same-origin' "$health_headers"

          private_status=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1/sams/backend/src/Helpers/Auth.php)
          test "$private_status" = "403"

          git_status=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1/sams/.git/config)
          test "$git_status" = "403"

          github_status=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1/sams/.github/workflows/php-ci.yml)
          test "$github_status" = "403"

          config_status=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1/sams/backend/config/database.php)
          test "$config_status" = "403"

          source_status=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1/sams/backend/src/Services/TeacherAttendanceService.php)
          test "$source_status" = "403"

          echo "[PASS] Apache 2.4 production-path smoke: /sams/ redirect, PHP execution, /api/v1 routing, security headers, and private-path denial"

  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sams
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SAMS_TEST_DB_HOST: db
      SAMS_TEST_DB_PORT: 3306
      SAMS_TEST_DB_NAME: sams
      SAMS_TEST_DB_USER: root
      SAMS_TEST_DB_PASS: root
      SAMS_ALLOW_EXAMPLE_CONFIG: 1
      SAMS_E2E_PASSWORD: e2e-admin-password-2026
      SAMS_E2E_TEACHER_PASSWORD: e2e-teacher-password-2026
      SAMS_E2E_LIFECYCLE_USERNAME: e2e-lifecycle-user
      SAMS_E2E_LIFECYCLE_PASSWORD: e2e-lifecycle-password-2026
      SAMS_E2E_LIFECYCLE_RESET_PASSWORD: e2e-lifecycle-reset-2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install PHP 8.3 and MySQL extensions
        run: |
          apt-get update
          apt-get install -y php8.3-cli php8.3-mysql php8.3-mbstring php8.3-xml php8.3-zip php8.3-gd curl

      - name: Verify PHP runtime
        run: php -v

      - name: Install Composer and backend dependencies
        shell: bash
        run: |
          apt-get install -y composer
          composer --version
          cd backend
          composer install --no-interaction --prefer-dist --no-progress
          php -r "require 'vendor/autoload.php'; if (!class_exists('PhpOffice\\PhpSpreadsheet\\IOFactory')) { exit(1); } echo '[PASS] PhpSpreadsheet loaded' . PHP_EOL;"

      - name: Configure E2E database
        shell: bash
        run: |
          cat > config/database.php <<'PHP'
          <?php
          return [
              'host' => getenv('SAMS_TEST_DB_HOST') ?: 'db',
              'port' => (int)(getenv('SAMS_TEST_DB_PORT') ?: 3306),
              'database' => getenv('SAMS_TEST_DB_NAME') ?: 'sams',
              'username' => getenv('SAMS_TEST_DB_USER') ?: 'root',
              'password' => getenv('SAMS_TEST_DB_PASS') ?: 'root',
              'charset' => 'utf8mb4',
          ];
          PHP

      - name: Seed clean E2E school
        run: php scripts/e2e_seed.php

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Playwright E2E
        id: phase8_e2e
        env:
          SAMS_BASE_URL: http://127.0.0.1:8080/public/
          SAMS_E2E_USERNAME: admin
          SAMS_E2E_TEACHER_USERNAME: teacher.e2e
        shell: bash
        run: |
          : > /tmp/phase8-playwright.log
          exec > >(tee -a /tmp/phase8-playwright.log) 2>&1

          php -S 0.0.0.0:8080 scripts/dev_router.php > /tmp/sams-server.log 2>&1 &
          server_pid=$!

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/public/login.php > /dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "PHP server exited before becoming ready."
              cat /tmp/sams-server.log
              exit 1
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:8080/public/login.php > /dev/null 2>&1; then
            echo "PHP server did not become ready."
            cat /tmp/sams-server.log
            exit 1
          fi

          if grep -RInE 'test\.(skip|fixme|only)|describe\.(skip|only)' tests/e2e; then
            echo "Critical E2E suite contains skipped/focused tests."
            exit 1
          fi

          if grep -RIn 'waitForTimeout' tests/e2e; then
            echo "E2E suite must synchronize on observable behavior, not fixed sleeps."
            exit 1
          fi

          find tests/e2e -type f -name '*.js' -print0 | xargs -0 -n1 node --check

          overall_status=0

          reset_e2e_school() {
            php -r '$pdo = new PDO(sprintf("mysql:host=%s;port=%d;charset=utf8mb4", getenv("SAMS_TEST_DB_HOST"), (int)getenv("SAMS_TEST_DB_PORT")), getenv("SAMS_TEST_DB_USER"), getenv("SAMS_TEST_DB_PASS"), [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]); $db = getenv("SAMS_TEST_DB_NAME"); if (!preg_match("/^[A-Za-z0-9_]+$/", $db)) { throw new RuntimeException("Invalid E2E database name."); } $pdo->exec("DROP DATABASE " . $db); $pdo->exec("CREATE DATABASE " . $db);'
            php scripts/e2e_seed.php
          }

          run_e2e_group() {
            group_name="$1"
            shift
            echo "===== Phase 8 E2E: $group_name =====" | tee -a /tmp/phase8-playwright.log
            reset_e2e_school
            set +e
            npx playwright test "$@" --reporter=line 2>&1 | tee -a /tmp/phase8-playwright.log
            group_status=${PIPESTATUS[0]}
            set -e
            if [ "$group_status" -ne 0 ]; then
              echo "[FAIL] $group_name (exit $group_status)" | tee -a /tmp/phase8-playwright.log
              overall_status=1
            else
              echo "[PASS] $group_name" | tee -a /tmp/phase8-playwright.log
            fi
          }

          run_e2e_group "smoke" tests/e2e/smoke.spec.js

          run_e2e_group "teacher-core-1" tests/e2e/authenticated.spec.js \
            --grep 'login, operational|attendance edits are sent|teacher cannot access historical|teacher sees only assigned'

          run_e2e_group "teacher-core-2" tests/e2e/authenticated.spec.js \
            --grep 'teacher can sign, reopen|teacher weekly attendance'

          run_e2e_group "imports" tests/e2e/authenticated.spec.js \
            --grep 'admin can upload a Markdown|admin can upload a real XLSX|admin can review and explicitly confirm|admin can complete a CSV'

          run_e2e_group "history-and-signatures" tests/e2e/authenticated.spec.js \
            --grep 'admin can transfer a student|admin can view teachers|admin dashboard separates|admin can receive a fully signed'

          run_e2e_group "admin-and-logout" tests/e2e/authenticated.spec.js \
            --grep 'admin can manage a class and a user|logout invalidates the authenticated'

          run_e2e_group "phase8-admin" tests/e2e/phase8_admin.spec.js
          run_e2e_group "phase8-auth" tests/e2e/phase8_auth.spec.js
          run_e2e_group "phase8-mobile" tests/e2e/phase8_mobile.mobile.spec.js

          kill "$server_pid" 2>/dev/null || true
          exit "$overall_status"

      - name: Publish Phase 8 Playwright status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PHASE8_LOG_PATH: /tmp/phase8-playwright.log
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync(process.env.PHASE8_LOG_PATH) ? fs.readFileSync(process.env.PHASE8_LOG_PATH, 'utf8') : '';
            const failures = [...log.matchAll(/\[FAIL\] ([^\n]+)/g)].map((m) => m[1]);
            const outcome = '${{ steps.phase8_e2e.outcome }}';
            const state = outcome === 'success' ? 'success' : 'failure';
            const tail = log.trim().slice(-70).replace(/\s+/g, ' ');
            const description = (failures.length
              ? 'Failed groups: ' + failures.join('; ')
              : outcome === 'success'
                ? 'All Phase 8 E2E groups passed.'
                : 'E2E preflight/runner failed: ' + tail).slice(0, 140);
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'phase8/e2e-groups',
              description
            });

  clean-school-acceptance:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
