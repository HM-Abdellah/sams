name: SAMS PHP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php:
    runs-on: ubuntu-latest
    container:
      image: php:8.4-cli

    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sams
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SAMS_TEST_DB_HOST: db
      SAMS_TEST_DB_PORT: 3306
      SAMS_TEST_DB_NAME: sams
      SAMS_TEST_DB_USER: root
      SAMS_TEST_DB_PASS: root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install MySQL PDO extension
        shell: sh
        run: docker-php-ext-install pdo_mysql

      - name: Lint PHP sources
        shell: sh
        run: |
          find api app config public scripts tests -type f -name '*.php' -print0             | xargs -0 -n1 php -l

      - name: Run service tests
        shell: sh
        run: php tests/run.php

      - name: Run MariaDB integration tests
        shell: sh
        run: php tests/integration.php

  javascript:
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        shell: sh
        run: |
          find public/assets/js tests/e2e -type f -name '*.js' -print0             | xargs -0 -n1 node --check
