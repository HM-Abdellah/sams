name: SAMS PHP CI

concurrency:
  group: sams-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, refactor/phase-2-backend-foundation, feat/phase-3-school-import-v2]
  pull_request:
    branches: [main, refactor/phase-2-backend-foundation]

jobs:
  php:
    runs-on: ubuntu-latest
    container:
      image: php:8.3-cli

    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sams
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SAMS_TEST_DB_HOST: db
      SAMS_TEST_DB_PORT: 3306
      SAMS_TEST_DB_NAME: sams
      SAMS_TEST_DB_USER: root
      SAMS_TEST_DB_PASS: root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install PHP extensions and Composer
        shell: sh
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libxml2-dev libonig-dev libzip-dev libfreetype6-dev libjpeg62-turbo-dev libpng-dev libwebp-dev curl unzip
          docker-php-ext-configure gd --with-freetype --with-jpeg --with-webp
          docker-php-ext-install dom gd mbstring pdo_mysql xml xmlwriter zip

          EXPECTED_CHECKSUM="$(curl -fsSL https://composer.github.io/installer.sig)"
          curl -fsSL https://getcomposer.org/installer -o composer-setup.php
          echo "${EXPECTED_CHECKSUM}  composer-setup.php" | sha384sum -c -
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          rm composer-setup.php

      - name: Verify PHP runtime
        shell: sh
        run: php -v

      - name: Install backend dependencies
        working-directory: backend
        shell: sh
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure backend database
        shell: sh
        run: |
          cat > backend/config/database.php <<'PHP'
          <?php
          return [
              'host' => getenv('SAMS_TEST_DB_HOST') ?: 'db',
              'port' => (int)(getenv('SAMS_TEST_DB_PORT') ?: 3306),
              'database' => getenv('SAMS_TEST_DB_NAME') ?: 'sams',
              'username' => getenv('SAMS_TEST_DB_USER') ?: 'root',
              'password' => getenv('SAMS_TEST_DB_PASS') ?: 'root',
              'charset' => 'utf8mb4',
          ];
          PHP

      - name: Lint PHP sources
        shell: sh
        run: |
          find api app backend config public scripts tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run legacy service tests
        shell: sh
        run: php tests/run.php

      - name: Run backend unit tests
        working-directory: backend
        shell: sh
        run: vendor/bin/phpunit --configuration phpunit.xml

      - name: Run MariaDB integration tests
        shell: sh
        run: php tests/integration.php

      - name: Run whole-school import integration tests
        shell: sh
        run: php tests/school_import_final_integration.php

      - name: Run API HTTP smoke tests
        shell: sh
        run: |
          php -S 127.0.0.1:8090 scripts/dev_router.php > /tmp/sams-api.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 20); do
            if curl -sS http://127.0.0.1:8090/api/v1/health > /tmp/sams-health.json 2>/dev/null; then
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "API server exited before becoming ready."
              cat /tmp/sams-api.log
              exit 1
            fi

            sleep 1
          done

          health_status=$(curl -sS -o /tmp/sams-health.json -w "%{http_code}" http://127.0.0.1:8090/api/v1/health)
          test "$health_status" = "200"
          grep -q '"success":true' /tmp/sams-health.json
          grep -q '"api_version":"v1"' /tmp/sams-health.json

          method_status=$(curl -sS -o /tmp/sams-method.json -w "%{http_code}" -X POST http://127.0.0.1:8090/api/v1/health)
          test "$method_status" = "405"
          grep -q '"success":false' /tmp/sams-method.json

          missing_status=$(curl -sS -o /tmp/sams-missing.json -w "%{http_code}" http://127.0.0.1:8090/api/v1/does-not-exist)
          test "$missing_status" = "404"

          import_auth_status=$(curl -sS -o /tmp/sams-import-auth.json -w "%{http_code}" -X POST http://127.0.0.1:8090/api/v1/imports/school/1/reconcile)
          test "$import_auth_status" = "401"
          grep -q '"success":false' /tmp/sams-import-auth.json

          echo "[PASS] API HTTP smoke: health=200 method=405 missing=404 import-auth=401"

  javascript:
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        shell: sh
        run: |
          find public/assets/js tests/e2e -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sams
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SAMS_TEST_DB_HOST: db
      SAMS_TEST_DB_PORT: 3306
      SAMS_TEST_DB_NAME: sams
      SAMS_TEST_DB_USER: root
      SAMS_TEST_DB_PASS: root
      SAMS_E2E_PASSWORD: e2e-admin-password-2026
      SAMS_E2E_TEACHER_PASSWORD: e2e-teacher-password-2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install PHP 8.3 and MySQL extensions
        run: |
          apt-get update
          apt-get install -y php8.3-cli php8.3-mysql php8.3-mbstring curl

      - name: Verify PHP runtime
        run: php -v

      - name: Configure E2E database
        shell: bash
        run: |
          cat > config/database.php <<'PHP'
          <?php
          return [
              'host' => getenv('SAMS_TEST_DB_HOST') ?: 'db',
              'port' => (int)(getenv('SAMS_TEST_DB_PORT') ?: 3306),
              'database' => getenv('SAMS_TEST_DB_NAME') ?: 'sams',
              'username' => getenv('SAMS_TEST_DB_USER') ?: 'root',
              'password' => getenv('SAMS_TEST_DB_PASS') ?: 'root',
              'charset' => 'utf8mb4',
          ];
          PHP

      - name: Seed clean E2E school
        run: php scripts/e2e_seed.php

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Run Playwright E2E
        env:
          SAMS_BASE_URL: http://127.0.0.1:8080/public/
          SAMS_E2E_USERNAME: admin
          SAMS_E2E_TEACHER_USERNAME: teacher.e2e
        shell: bash
        run: |
          php -S 0.0.0.0:8080 scripts/dev_router.php > /tmp/sams-server.log 2>&1 &
          server_pid=$!

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/public/login.php > /dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "PHP server exited before becoming ready."
              cat /tmp/sams-server.log
              exit 1
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:8080/public/login.php > /dev/null 2>&1; then
            echo "PHP server did not become ready."
            cat /tmp/sams-server.log
            exit 1
          fi

          npm run test:e2e
          test_status=$?
          kill "$server_pid" 2>/dev/null || true
          exit "$test_status"
